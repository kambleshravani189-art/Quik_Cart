<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuickCart | Login</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- NAVBAR -->

<header class="navbar">

    <div class="logo">

        <i class="fa-solid fa-basket-shopping"></i>

        QuickCart

    </div>


    <a href="index.html"
       class="login-home">

        <i class="fa-solid fa-house"></i>

        Home

    </a>

</header>



<!-- LOGIN -->

<main class="login-page">


    <div class="login-card">


        <div class="login-icon">

            <i class="fa-solid fa-user"></i>

        </div>


        <h1>
            Welcome to QuickCart
        </h1>


        <p class="login-subtitle">

            Login to continue shopping

        </p>



        <form id="loginForm">


            <!-- MOBILE -->

            <label>
                Mobile Number
            </label>


            <div class="input-box">

                <i class="fa-solid fa-phone"></i>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    maxlength="10"
                    required>

            </div>



            <!-- PASSWORD -->

            <label>
                Password
            </label>


            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

                <i class="fa-solid fa-eye"
                   id="showPassword"
                   onclick="togglePassword()">
                </i>

            </div>



            <div class="forgot">

                <a href="#">
                    Forgot Password?
                </a>

            </div>



            <button
                type="submit"
                class="login-button">

                Login

                <i class="fa-solid fa-arrow-right"></i>

            </button>


        </form>



        <div class="divider">

            <span>OR</span>

        </div>



        <button
            class="guest-button"
            onclick="continueAsGuest()">

            Continue as Guest

        </button>



        <p class="signup-text">

             Don't have an account?
             <a href="signup.html">Sign Up</a>
       
        </p>

    </div>

</main>



<!-- FOOTER -->

<footer>

    <h2>
        🛒 QuickCart
    </h2>

    <p>
        Your everyday grocery delivery partner.
    </p>

    <p>
        © 2026 QuickCart
    </p>

</footer>



<script src="script.js"></script>

</body>

</html>
